
syntax = "proto3";

// option java_multiple_files = true;
// option java_package = "io.autodiscovery";
// option java_outer_classname = "GrpcRocProto";
// option objc_class_prefix = "HLW";

package dc;

// greeting service definition.
service DcRpc
{
    rpc subscribe(Peer) returns (stream Message)
    {
    }
    rpc updatePeer(Peer) returns (Empty)
    {
    }
    rpc unsubscribe(Peer) returns (Empty)
    {
    }
    rpc sendMessage(Message) returns (Empty)
    {
    }
    rpc p2pInit(P2PInit) returns (Empty)
    {
    }
    rpc p2pAccept(P2PAccept) returns (Empty)
    {
    }
    rpc p2pCandidate(P2PCandidate) returns (Empty)
    {
    }
    rpc p2pDisconnect(P2PDisconnect) returns (Empty)
    {
    }
}

message Empty
{
}

enum PeerType
{
    UNKNOWN = 0x00;
    READER  = 0x01;
    WRITER  = 0x02;
}

message Peer
{
    string id     = 1;
    string group  = 2;
    PeerType type = 3;
}

message PeerList
{
    repeated Peer peers = 1;
}

enum MessageType
{
    P2PGENERIC    = 0x00;
    P2PLIST       = 0x01;
    P2PINIT       = 0x02;
    P2PACCEPT     = 0x03;
    P2PCANDIDATE  = 0x04;
    P2PDISCONNECT = 0x05;
}

message Message
{
    string from      = 1;
    string to        = 2;
    MessageType type = 3;
    oneof payload
    {
        string data    = 4;
        PeerList peers = 5;
    }
}

message P2PInit
{
    string from = 1;
    string to   = 2;
    string sdp  = 3;
}

message P2PAccept
{
    string from = 1;
    string to   = 2;
    string sdp  = 3;
}

message P2PCandidate
{
    string from      = 1;
    string to        = 2;
    string candidate = 3;
}

message P2PDisconnect
{
    string from   = 1;
    string to     = 2;
    string reason = 3;
}
