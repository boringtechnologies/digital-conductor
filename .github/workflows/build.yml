name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_call:

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

jobs:
  rake:
    name: Build on ${{ matrix.os }} with packages from ${{ matrix.package-manager }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        os: [ ubuntu-latest ]
        experimental: [ false ]
        package-manager: [ default ]
        output-package: [ deb ]
        include:
          - os: macos-latest
            experimental: false
            package-manager: conan
            conan-profile: conan/profiles/intel
            output-package: dmg
          - os: ubuntu-latest
            experimental: true
            package-manager: conan
            conan-profile: conan/profiles/linux
            output-package: deb
    steps:
      - uses: actions/checkout@v3

      - uses: jurplel/install-qt-action@v3
        with:
          version: 6.4.*
          cache: true
          dir: ${{ github.workspace }}

      - run: |
          if [ "$(uname)" == "Darwin" ]; then
            QT_ROOT=${{ github.workspace }}/Qt/6.4.0/macos
          elif [ "$(expr substr $(uname -s) 1 5)" == "Linux" ]; then
            QT_ROOT=${{ github.workspace }}/Qt/6.4.0/gcc_64
          fi
          conan/add_cmake_cache_entry.sh QT_DIR "${QT_ROOT}/lib/cmake"
          echo "QT_ROOT=${QT_ROOT}" >> $GITHUB_ENV

      - if: matrix.os == 'macos-latest'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '13.2.1'

      - name: cache build deps
        if: matrix.package-manager == 'default'
        uses: actions/cache@v3
        with:
          path: |
            grpc/install
            libjuice/install
            cxxopts

          key: ${{ runner.os }}-${{ matrix.package-manager }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.package-manager }}-${{ hashFiles('conanfile.txt') }}
            ${{ runner.os }}-${{ matrix.package-manager }}-

      - name: cache conan deps
        if: matrix.package-manager == 'conan'
        uses: actions/cache@v3
        with:
          path: ~/.conan/data
          key: ${{ runner.os }}-${{ matrix.package-manager }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.package-manager }}-${{ hashFiles('conanfile.txt') }}
            ${{ runner.os }}-${{ matrix.package-manager }}-

      - name: cache compiled objects
        uses: actions/cache@v3
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}

      - name: install tools
        run: |
          if [ "$(uname)" == "Darwin" ]; then
            brew install cmake ccache
          elif [ "$(expr substr $(uname -s) 1 5)" == "Linux" ]; then
            sudo apt-get install -y build-essential cmake clang ccache libc++-dev
              # libva-dev libvdpau-dev libvulkan-dev
            sudo snap install cqtdeployer
          fi
          ccache -M 2G
          ccache -p

      - name: install packages with system package-manager (+ compile missing)
        if: matrix.package-manager == 'default'
        run: |
          if [ "$(uname)" == "Darwin" ]; then
            brew install autoconf automake libtool

            # gstreamer
            brew install gstreamer gst-plugins-{base,good,bad,ugly} gst-libav
          elif [ "$(expr substr $(uname -s) 1 5)" == "Linux" ]; then
            sudo apt-get install -y autoconf libtool pkg-config

            # gstreamer
            sudo apt install -y libgstreamer1.0-dev \
              libgstreamer-plugins-base1.0-dev      \
              libgstreamer-plugins-bad1.0-dev       \
              gstreamer1.0-plugins-base             \
              gstreamer1.0-plugins-good             \
              gstreamer1.0-plugins-bad              \
              gstreamer1.0-libav                    \
              gstreamer1.0-x                        \
              gstreamer1.0-alsa                     \
              gstreamer1.0-gl                       \
              gstreamer1.0-pulseaudio
          fi

          # libjuice
          if [ ! -d "libjuice/install" ]; then
            git clone -b v1.0.5 https://github.com/paullouisageneau/libjuice.git
            pushd libjuice/
            cmake -S . -B build --install-prefix $(pwd)/install
            cmake --build build --target juice-static --target juice
            cmake --install build
            cp build/libjuice-static.a install/lib/
            popd
          fi
          conan/add_cmake_cache_entry.sh LibJuice_DIR "$(pwd)/libjuice/install/lib/cmake/LibJuice"
          conan/add_cmake_cache_entry.sh LibJuice_INCLUDE_DIRS "$(pwd)/libjuice/install/include"

          # grpc
          if [ ! -d "grpc/install" ]; then
            git clone -b v1.48.0 https://github.com/grpc/grpc
            pushd grpc
            git submodule update --init
            cmake -S . -B build --install-prefix $(pwd)/install
            cmake --build build
            cmake --install build
            popd
          fi
          conan/add_cmake_cache_entry.sh Protobuf_DIR "$(pwd)/grpc/install/lib/cmake/protobuf"
          conan/add_cmake_cache_entry.sh gRPC_DIR "$(pwd)/grpc/install/lib/cmake/grpc"
          conan/add_cmake_cache_entry.sh CMAKE_PREFIX_PATH "$(pwd)/grpc/install"

          # cxxopts
          if [ ! -d "cxxopts" ]; then
            git clone -b v3.0.0 https://github.com/jarro2783/cxxopts.git
            pushd cxxopts
            cmake .
            popd
          fi
          conan/add_cmake_cache_entry.sh cxxopts_DIR "$(pwd)/cxxopts"
          conan/add_cmake_cache_entry.sh cxxopts_INCLUDE_DIRS "$(pwd)/cxxopts/include"

      - name: install packages with conan package-manager
        if: matrix.package-manager == 'conan'
        run: |
          pip3 install conan

          sh conan/add_cmake_cache_entry.sh WITH_CONAN ON BOOL
          sh conan/add_cmake_cache_entry.sh WITH_CONAN_PROFILE "${{ github.workspace }}/${{ matrix.conan-profile }}"

          sh conan/export_receipts.sh

          conan install $(pwd)/conanfile.txt      \
            --install-folder $(pwd)/build/conan   \
            --build=outdated                      \
            --settings build_type=Release         \
            --profile "${{ github.workspace }}/${{ matrix.conan-profile }}"
          conan remove --build --src --force '*'

      - run: cmake -B build -S . -C CMakeCache.txt

      - run: cmake --build build

      - run: env PATH="${{ env.QT_ROOT }}/bin:$PATH" ./build-package.sh
        working-directory: package/${{ matrix.output-package }}

      - uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.os }}-${{ matrix.package-manager }}-${{ matrix.output-package }}
          path: |
            bin/*.dmg
            bin/*.deb
